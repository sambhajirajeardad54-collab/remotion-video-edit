# Lakshya Academy Android builds on Expo's build servers (EAS).
#
# Needs the repository secret EXPO_TOKEN (Settings → Secrets and variables →
# Actions). Create the token at expo.dev → Account settings → Access tokens.
#
# Run from GitHub: Actions → "Android build" → Run workflow, then choose:
#   preview-apk             installable test APK            ← default
#   production-apk          signed production APK for test phones
#   production-aab          signed Android App Bundle for Google Play
#   production-apk-and-aab  both production files
# The workflow waits for EAS to finish and attaches the .apk/.aab to the run
# (scroll to "Artifacts" on the run page). Builds are also listed on expo.dev.
# The first build creates the app's signing key on EAS — back it up afterwards
# (expo.dev → project → Credentials → Android → Download keystore).
name: Android build

on:
  workflow_dispatch:
    inputs:
      build:
        description: What to build
        type: choice
        default: preview-apk
        options:
          - preview-apk
          - production-apk
          - production-aab
          - production-apk-and-aab

permissions:
  contents: read

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    # EAS free-tier builds can wait in a queue before they start.
    timeout-minutes: 120
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS: npx --yes eas-cli@27.11.0
      OUT: ${{ github.workspace }}/android-builds
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        working-directory: .

      - name: EXPO_TOKEN is configured and valid (value never printed)
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error title=EXPO_TOKEN missing::The repository secret EXPO_TOKEN is not set. Expo cannot build without it. Add it under Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          $EAS whoami || { echo "::error title=EXPO_TOKEN invalid::Expo rejected the token. Create a new one at expo.dev and update the secret."; exit 1; }

      - name: Build configuration
        run: |
          npx expo config --type public --json | node -e '
            const c = JSON.parse(require("fs").readFileSync(0));
            console.log(`name=${c.name} package=${c.android?.package} version=${c.version}`);
            if (c.android?.package !== "com.lakshyaacademy.app" || c.name !== "Lakshya Academy") {
              console.error("::error::Unexpected app name or Android package ID"); process.exit(1);
            }'

      - name: Production builds run only from main
        if: startsWith(inputs.build, 'production') && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run production builds from the main branch."
          exit 1

      - name: Link the EAS project
        run: $EAS init --non-interactive --force

      - name: Build on EAS and download
        run: |
          mkdir -p "$OUT"
          build() { # $1 = eas.json profile, $2 = output file name
            echo "::group::EAS build: profile $1"
            $EAS build --platform android --profile "$1" --non-interactive --wait --json > "$RUNNER_TEMP/$1.json"
            echo "::endgroup::"
            url=$(node -e 'const b = JSON.parse(require("fs").readFileSync(process.argv[1]))[0];
              if (b.status !== "FINISHED" || !b.artifacts?.buildUrl) { console.error("Build " + b.id + " ended with status " + b.status); process.exit(1); }
              console.log(b.artifacts.buildUrl)' "$RUNNER_TEMP/$1.json")
            curl -fsSL --retry 3 -o "$OUT/$2" "$url"
            echo "Downloaded $2 ($(du -h "$OUT/$2" | cut -f1))"
            echo "- \`$2\` (EAS profile \`$1\`)" >> "$GITHUB_STEP_SUMMARY"
          }
          echo "### Android build: \`${{ inputs.build }}\`" >> "$GITHUB_STEP_SUMMARY"
          case "${{ inputs.build }}" in
            preview-apk)            build preview        lakshya-academy-preview.apk ;;
            production-apk)         build production-apk lakshya-academy-production.apk ;;
            production-aab)         build production     lakshya-academy-production.aab ;;
            production-apk-and-aab) build production-apk lakshya-academy-production.apk
                                    build production     lakshya-academy-production.aab ;;
          esac
          echo "Download from the **Artifacts** section of this run, or from expo.dev → Projects → lakshya-academy → Builds." >> "$GITHUB_STEP_SUMMARY"

      - name: Attach the APK/AAB to this run
        # Also runs if a later build failed, so files that did build are kept.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lakshya-academy-${{ inputs.build }}
          path: android-builds/
          if-no-files-found: warn
          retention-days: 30

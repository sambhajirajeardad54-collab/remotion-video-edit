# Builds an installable Android APK on Expo's build servers (EAS).
# One-time setup: create a free account at expo.dev, create an access token,
# and add it to this repo as the secret EXPO_TOKEN (Settings → Secrets → Actions).
# Then run this workflow from the GitHub app: Actions → Android APK → Run workflow.
name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        working-directory: .
      - name: Check token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo "::error::Add the EXPO_TOKEN repository secret first."; exit 1; fi
      - name: Link EAS project and build APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli@27.11.0 init --non-interactive --force
          npx eas-cli@27.11.0 build --platform android --profile preview --non-interactive --no-wait
